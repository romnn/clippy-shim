[package]
name = "clippy-shim"
version = "0.0.2"
edition = "2024"
authors = ["romnn <contact@romnn.com>"]
description = "A tiny shim around cargo clippy"
publish = false
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/romnn/clippy-shim"
repository = "https://github.com/romnn/clippy-shim"
categories = [
  "command-line-utilities",
  "development-tools",
  "development-tools::cargo-plugins",
  "development-tools::testing"
]
keywords = [
  "cargo",
  "clippy",
  "shim",
]
exclude = [
  "taskfile.yaml",
  "TODO.md",
  ".github",
  ".bumpversion.toml",
  ".typos.toml",
  ".ignore",
]

[lints]
workspace = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
allow_attributes_without_reason = "deny"

map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[dependencies]

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

# The working-tree lint shim preserves Clippy's JSON diagnostics.
[workspace.metadata.cargo-fc.subcommands.lint]
dedupe = true

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
